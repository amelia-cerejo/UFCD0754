      function renderProjetoFinalDocumentoHtml(){return '<div style="font-family:Segoe UI,Aptos,Calibri,Arial,sans-serif;color:'+colors.text+';max-width:1100px;margin:0 auto 24px auto;"><div style="background-color:'+colors.white+';border:1px solid '+colors.line+';border-radius:8px;overflow:hidden;margin-bottom:18px;box-shadow:0 10px 24px rgba(43,87,154,.07);"><div style="padding:18px 22px 14px 22px;border-bottom:4px solid '+colors.lightBlue+';"><h3 style="margin:0;color:'+colors.blue+';font-size:24px;font-weight:900;">Projeto Final: Documento Profissional</h3><p style="margin:8px 0 0 0;font-size:14px;line-height:1.5;color:'+colors.muted+';">Enunciado final da UFCD 0754 para desenvolver, rever, concluir e apresentar um documento profissional.</p></div><div style="padding:20px 22px;border-top:4px solid '+colors.blue+';"><h4 style="margin:0 0 10px 0;color:'+colors.blue+';font-size:18px;">Objetivo</h4><p style="font-size:14px;line-height:1.6;margin-bottom:18px;">Construir um documento profissional único, organizado, tecnicamente consistente, revisto entre pares e entregue em DOCX e PDF.</p><h4 style="margin:0 0 14px 0;color:'+colors.blue+';font-size:18px;">Configuração mínima</h4><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px;"><div style="border-left:4px solid '+colors.lightBlue+';background-color:'+colors.softBlue+';padding:12px;"><strong>Tema</strong><br>Documento Profissional</div><div style="border-left:4px solid '+colors.lightBlue+';background-color:'+colors.softBlue+';padding:12px;"><strong>Extensão</strong><br>8 a 12 páginas de conteúdo, máximo 20 no total</div><div style="border-left:4px solid '+colors.lightBlue+';background-color:'+colors.softBlue+';padding:12px;"><strong>Entrega</strong><br>DOCX, PDF e ligação de leitura testada</div></div><h4 style="margin:0 0 14px 0;color:'+colors.blue+';font-size:18px;">Requisitos</h4><div style="display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:22px;"><div style="border-left:4px solid '+colors.blue+';background-color:'+colors.softBlue+';padding:12px;"><strong>Estrutura</strong><br>Capa, índice automático, introdução, desenvolvimento, conclusão, referências e anexos quando necessários.</div><div style="border-left:4px solid '+colors.blue+';background-color:'+colors.softBlue+';padding:12px;"><strong>Formatação</strong><br>Título 1, Título 2, Título 3, estilos coerentes, cabeçalhos, rodapés e paginação.</div><div style="border-left:4px solid '+colors.blue+';background-color:'+colors.softBlue+';padding:12px;"><strong>Elementos técnicos</strong><br>Tabelas, imagens, legendas, índices de figuras/tabelas quando aplicáveis, referências cruzadas, hiperligações, nota de rodapé e impressão em série explicada e demonstrada.</div><div style="border-left:4px solid '+colors.blue+';background-color:'+colors.softBlue+';padding:12px;"><strong>Conclusão</strong><br>Revisão entre pares, reflexão individual final e apresentação individual até 5 minutos.</div></div><div style="background-color:'+colors.softBlue+';border-left:4px solid '+colors.blue+';padding:16px;border-radius:4px;margin-bottom:18px;"><h4 style="margin:0 0 10px 0;color:'+colors.blue+';font-size:18px;">Entrega no Moodle</h4><ul style="font-size:14px;line-height:1.7;margin:0;padding-left:20px;"><li>Publicar a ligação de leitura para o PDF final, testada sem sessão iniciada.</li><li>Guardar o DOCX final como 2026-07_Projeto_Final_PrimeiroNome.docx.</li><li>Exportar o PDF final como 2026-07_Projeto_Final_PrimeiroNome.pdf.</li><li>Registar as principais decisões relativas ao feedback recebido.</li></ul></div><a style="display:block;text-decoration:none;color:inherit;" href="'+moodleLinks.site+'atividades/projeto-final-apresentacao.html"><div style="background-color:'+colors.softBlue+';border-left:4px solid '+colors.lightBlue+';padding:16px;border-radius:4px;cursor:pointer;"><h4 style="margin:0 0 10px 0;color:'+colors.blue+';font-size:18px;">Página de apoio ao Projeto Final</h4><p style="font-size:14px;line-height:1.6;margin:0;color:'+colors.text+';">Abrir a página com os requisitos finais do Projeto Final da UFCD 0754.</p></div></a></div></div></div><div style="width:100%;margin:0 auto;padding:14px;border:1px solid '+colors.line+';border-radius:8px;background:'+colors.white+';box-shadow:0 10px 24px rgba(43,87,154,.07);font-family:Segoe UI,Aptos,Calibri,Arial,sans-serif;"><iframe style="width:100%;min-height:700px;border:0;border-radius:8px;display:block;background:'+colors.white+';" title="Projeto Final - Documento Profissional UFCD 0754" src="'+moodleLinks.site+'atividades/projeto-final-apresentacao.html" allow="camera; microphone; geolocation; display-capture; clipboard-write" allowfullscreen="allowfullscreen" loading="lazy"></iframe></div>'}
      function renderEPortfoliosMoodleHtml(){return cardStart(colors.darkBlue)+'<p style="margin:0 0 8px;color:'+colors.darkBlue+';font-size:12px;font-weight:900;text-transform:uppercase;">A&ccedil;&atilde;o 26109</p><h3 style="margin:0;color:'+colors.blue+';font-size:28px;line-height:1.16;font-weight:900;">E-Portef&oacute;lios da turma</h3><p style="margin:12px 0 0;max-width:820px;font-size:15px;line-height:1.6;">Espa&ccedil;o para publicar as liga&ccedil;&otilde;es finais dos trabalhos/e-portef&oacute;lios dos formandos, quando estiverem dispon&iacute;veis.</p><div style="margin-top:16px;padding:16px;border:1px dashed '+colors.line+';border-radius:8px;background:'+colors.softBlue+';">Substituir este bloco pelos iframes ou liga&ccedil;&otilde;es finais de cada formando/a.</div>'+cardEnd()}

te;rio do Moodle.</li></ol></div></div>'}
      function renderTgDayHtml(task){return cardStart(colors.lightBlue)+'<p style="margin:0 0 8px;color:'+colors.darkBlue+';font-size:12px;font-weight:900;text-transform:uppercase;">Tarefa de Grupo</p><h3 style="margin:0 0 16px;color:'+colors.blue+';font-size:24px;line-height:1.2;font-weight:900;">'+task.title+'</h3><table style="width:100%;border-collapse:collapse;overflow:hidden;border:1px solid '+colors.line+';border-radius:8px;font-size:15px;"><thead><tr><th style="width:28%;padding:12px;text-align:left;color:#fff;background:'+colors.blue+';">Grupo</th><th style="padding:12px;text-align:left;color:#fff;background:'+colors.blue+';">Palavra / Termo</th></tr></thead><tbody>'+task.words.map(([room,word])=>'<tr><td style="padding:12px;border-top:1px solid '+colors.line+';background:'+colors.softBlue+';font-weight:900;">'+room+'</td><td style="padding:12px;border-top:1px solid '+colors.line+';">'+word+'</td></tr>').join('')+'</tbody></table>'+cardEnd()}
      function renderTiOverviewHtml(){return '<div style="max-width:1100px;margin:0 auto 24px;font-family:Segoe UI,Aptos,Calibri,sans-serif;color:'+colors.text+';"><a style="display:block;color:inherit;text-decoration:none;" href="'+moodleLinks.forum1+'"><div style="position:relative;overflow:hidden;border:1px solid '+colors.line+';border-radius:8px;background:'+colors.white+';box-shadow:0 10px 24px rgba(43,87,154,.07);"><div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:20px;padding:28px 30px 34px;"><div><h3 style="margin:0;color:'+colors.blue+';font-size:28px;line-height:1.16;font-weight:900;">F&oacute;rum de atividades</h3><p style="margin:12px 0 0;max-width:760px;font-size:15px;line-height:1.6;">F&oacute;rum dedicado &agrave;s tarefas, organizado por t&oacute;picos tem&aacute;ticos.</p></div><div style="display:grid;place-items:center;width:64px;min-width:64px;height:64px;border:1px solid '+colors.line+';border-radius:8px;background:'+colors.softOrange+';color:'+colors.darkBlue+';font-size:30px;font-weight:900;">TI</div></div><div style="position:absolute;left:0;right:0;bottom:0;height:7px;background:linear-gradient(90deg,'+colors.blue+','+colors.lightBlue+','+colors.darkBlue+');"></div></div></a><div style="margin-top:14px;padding:18px 20px;border:1px solid '+colors.line+';border-radius:8px;background:'+colors.white+';box-shadow:0 10px 24px rgba(43,87,154,.07);font-size:15px;"><p style="margin:0 0 12px;line-height:1.6;">Cada t&oacute;pico corresponde a um tema da UFCD e inclui a respetiva atividade individual.</p><ol style="margin:0;padding-left:42px;line-height:1.65;"><li>L&ecirc; o enunciado com aten&ccedil;&atilde;o antes de come&ccedil;ar.</li><li>Resolve a tarefa de forma aut&oacute;noma.</li><li>Organiza a resposta de forma clara e completa.</li><li>Sempre que fizer sentido, aplica exemplos pr&aacute;ticos relacionados com a forma&ccedil;&atilde;o.</li><li>Rev&ecirc; o trabalho antes de submeter ou publicar a resposta no Moodle.</li></ol></div></div>'}
      function renderTiHtml(task,index){const accent=index<6?colors.lightBlue:colors.darkBlue;const isProjetoFinal=task.title.indexOf('TI11 -')===0||task.title.indexOf('TI12 -')===0;const bodyHtml=isProjetoFinal?'<p style="margin:0;line-height:1.7;"><strong>O que fazer:</strong> Seguir o enunciado completo da tarefa, realizar o trabalho indicado e publicar no Moodle o registo solicitado pela formadora.</p>':'<p style="margin:0 0 8px;font-weight:900;color:'+colors.darkBlue+';">O que fazer:</p><ul style="margin:0;padding-left:22px;line-height:1.7;">'+task.steps.map(step=>'<li>'+step+'</li>').join('')+'</ul>';return cardStart(accent)+'<h3 style="margin:0 0 12px;color:'+colors.blue+';font-size:24px;line-height:1.2;font-weight:900;">'+task.title+'</h3><p style="margin:0 0 14px;line-height:1.6;"><strong>Objetivo:</strong> '+task.objective+'</p>'+bodyHtml+cardEnd()}
      function escapeHtml(value){return value.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
      const templates=[{title:'P&aacute;gina de apoio - cart&atilde;o da sec&ccedil;&atilde;o',description:'Cart&atilde;o para abrir a p&aacute;gina de apoio da UFCD no Moodle.',html:renderPageCardHtml()},{title:'P&aacute;gina de apoio - conte&uacute;do da p&aacute;gina',description:'Iframe para colocar dentro da p&aacute;gina Moodle.',html:renderPageIframeHtml()},{title:'Brainstorming - Mentimeter incorporado',description:'Iframe do Mentimeter fornecido.',html:renderMentimeterHtml()},{title:'Percurso pr&aacute;tico: Processador de Texto',description:'Bloco Moodle com orienta&ccedil;&otilde;es do percurso pr&aacute;tico das TI.',html:renderProjetoFinalMoodleHtml()},{title:'Projeto Final - Documento Profissional',description:'Bloco Moodle para o Projeto Final da UFCD 0754.',html:renderProjetoFinalDocumentoHtml()},{title:'TG - Gloss&aacute;rio colaborativo',description:'Bloco geral para a tarefa de grupo no Gloss&aacute;rio Moodle.',html:renderTgOverviewHtml()},...tgTasks.map(task=>({title:'TG - '+task.title,description:'Tabela de palavras por grupo.',html:renderTgDayHtml(task)})),{title:'TI - F&oacute;rum de tarefas individuais',description:'Bloco geral para apresentar o f&oacute;rum das tarefas individuais.',html:renderTiOverviewHtml()},...tiTasks.map((task,index)=>({title:task.title,description:'HTML para o t&oacute;pico Moodle da tarefa individual.',html:renderTiHtml(task,index)}))];
      function renderTemplates(){const root=document.getElementById('templates');root.innerHTML=templates.map((template,index)=>'<article class="template-card"><div class="template-head"><div><h2>'+(index+1)+'. '+template.title+'</h2><p>'+template.description+'</p></div><button class="copy-button" type="button" data-copy="'+index+'">Copiar HTML</button></div><div class="template-body"><div class="preview" aria-label="Pr&eacute;-visualiza&ccedil;&atilde;o">'+template.html+'</div><div class="code-panel"><textarea spellcheck="false" aria-label="C&oacute;digo HTML do modelo '+template.title+'">'+escapeHtml(template.html)+'</textarea></div></div></article>').join('')}
      async function copyTemplate(index,button){const html=templates[index].html;try{await navigator.clipboard.writeText(html);button.textContent='Copiado';setTimeout(()=>{button.textContent='Copiar HTML'},1600)}catch(error){const textarea=button.closest('.template-card').querySelector('textarea');textarea.focus();textarea.select();button.textContent='Selecionado'}}
      renderTemplates();document.addEventListener('click',event=>{const button=event.target.closest('[data-copy]');if(!button)return;copyTemplate(Number(button.dataset.copy),button)});
